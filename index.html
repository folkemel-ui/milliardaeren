<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover gir CSS-en env(safe-area-inset-*), så menyen holder seg klar av hjemindikatoren. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fra 1 000 kr og en saftbod til milliardær." />
    <meta name="theme-color" content="#0d0c0a" />
    <link rel="icon" type="image/svg+xml" href="./ikon.svg" />
    <!-- iOS bruker ikke SVG på hjemskjermen: en PNG uten gjennomsiktighet. Lages av scripts/lag-ikoner.mjs. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milliardær" />
    <title>Milliardær</title>
    <!-- Lyst tema og redusert bevegelse settes før noe tegnes, så lasteskjermen ikke blinker mørk eller beveger seg
         når spilleren har bedt om ro (samme nøkler som ui/tema.ts og ui/innstillinger.ts). -->
    <script>
      try {
        if (localStorage.getItem('milliardaer.tema') === 'lys') document.documentElement.dataset.theme = 'light'
        if (localStorage.getItem('milliardaer.bevegelse') === 'redusert') document.documentElement.dataset.bevegelse = 'redusert'
      } catch (e) {}
    </script>
    <!-- Lasteskjermen står i #root til spillet tegner seg selv over den. Stilen er her, fordi CSS-en kommer med skriptet.
         Grafikkpakke G7: mynten kommer fram, M-en tegner seg selv, en glans går over mynten og stjerna glimter;
         så puster den rolig til spillet er klart. -->
    <style>
      html, body { margin: 0; background: #0d0c0a; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f4f5f7; }
      .laster { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: system-ui, sans-serif; }
      .laster svg { overflow: visible; animation: laster-inn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both, laster-pust 2.6s ease-in-out 2.2s infinite; }
      .laster .m { animation: laster-tegn 0.9s cubic-bezier(0.5, 0, 0.2, 1) 0.3s both; }
      .laster .glans { animation: laster-glans 0.8s ease-in-out 1.15s both; }
      .laster .stjerne { transform-origin: 382px 140px; animation: laster-glimt 0.6s ease-out 1.65s both; }
      .laster span { color: #d4af37; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; animation: laster-tekst 0.5s ease-out 0.5s both; }
      html[data-theme='light'] .laster span { color: #9c7c1c; }
      @keyframes laster-inn { from { opacity: 0; transform: scale(0.86); } }
      @keyframes laster-tegn { from { stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } to { stroke-dasharray: 1 2; stroke-dashoffset: 0; opacity: 1; } }
      @keyframes laster-glans { from { transform: translateX(-60px); opacity: 0; } 20%, 80% { opacity: 0.5; } to { transform: translateX(470px); opacity: 0; } }
      @keyframes laster-glimt { from { transform: scale(0.3) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.3) rotate(8deg); opacity: 1; } }
      @keyframes laster-tekst { from { opacity: 0; transform: translateY(4px); } }
      @keyframes laster-pust { 50% { transform: scale(1.03); } }
      @media (prefers-reduced-motion: reduce) { .laster svg, .laster svg *, .laster span { animation: none !important; } .laster .glans { display: none; } }
      html[data-bevegelse='redusert'] .laster svg, html[data-bevegelse='redusert'] .laster svg *, html[data-bevegelse='redusert'] .laster span { animation: none !important; }
      html[data-bevegelse='redusert'] .laster .glans { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="laster" role="status">
        <svg width="96" height="96" viewBox="64 64 384 384" aria-hidden="true">
          <defs>
            <clipPath id="laster-mynt"><circle cx="256" cy="256" r="184" /></clipPath>
          </defs>
          <circle cx="256" cy="256" r="184" fill="#f0d27a" />
          <circle cx="264" cy="266" r="171" fill="#d4af37" />
          <circle cx="256" cy="256" r="148" fill="none" stroke="#9c7c1c" stroke-width="10" />
          <polyline class="m" pathLength="1" points="178,336 178,236 254,300 334,178 334,336" fill="none" stroke="#1a1508" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
          <g clip-path="url(#laster-mynt)">
            <g transform="rotate(20 256 256)">
              <rect class="glans" x="20" y="20" width="54" height="472" fill="#fff8e0" />
            </g>
          </g>
          <polygon class="stjerne" points="382,104 390,132 418,140 390,148 382,176 374,148 346,140 374,132" fill="#fff4c8" />
        </svg>
        <span>Milliardær</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
